openapi: 3.0.1
info:
  title: API V1
  version: v1

servers:
  - url: http://{defaultHost}
    variables:
      defaultHost:
        default: localhost:3000

paths:
  /auth/sign_in:
    post:
      summary: Login do usuário
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login bem-sucedido
        '401':
          description: Credenciais inválidas

  /api/v1/users:
    get:
      summary: Lista todos os usuários
      tags:
        - Users
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filtrar por nome
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, employee, hr]
          description: Filtrar por papel do usuário
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filtrar por status
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Página da paginação
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
          description: Quantidade de resultados por página
      responses:
        '200':
          description: Usuários encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      total_pages:
                        type: integer
                        example: 10
                      total_entries:
                        type: integer
                        example: 100
                      per_page:
                        type: integer
                        example: 10

  /api/v1/users/{id}/inactivate:
    patch:
      summary: Inativa um usuário
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário a ser inativado
      responses:
        '200':
          description: Usuário inativado com sucesso
        '401':
          description: Ação não autorizada
        '404':
          description: Usuário não encontrado

  /api/v1/users/{id}:
    delete:
      summary: Exclui um usuário
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário a ser excluído
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Usuário excluído com sucesso (sem conteúdo)
        '401':
          description: Ação não autorizada
        '404':
          description: Usuário não encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        role:
          type: string
          enum: [admin, employee, hr]
          example: admin
        status:
          type: string
          enum: [active, inactive]
          example: active
      required:
        - id
        - name
        - email
        - role
        - status

